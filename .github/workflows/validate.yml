name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - run: python scripts/build_plugin.py --check
      - run: npm pack --dry-run
      - run: bash -n install.sh scripts/install-git-hook.sh .githooks/pre-commit
      - name: Test global installer in an isolated home
        run: |
          export PROSE_HUMANIZER_HOME="$RUNNER_TEMP/prose-humanizer-home"
          ./install.sh
          test -f "$PROSE_HUMANIZER_HOME/.claude/skills/prose-humanizer/SKILL.md"
          test -f "$PROSE_HUMANIZER_HOME/.claude/skills/prose-humanizer/references/eval.md"
          test -f "$PROSE_HUMANIZER_HOME/.agents/skills/prose-humanizer/SKILL.md"
          test -f "$PROSE_HUMANIZER_HOME/.agents/skills/prose-humanizer/rules/patterns.json"
          test -f "$PROSE_HUMANIZER_HOME/.agents/skills/prose-humanizer/evals/cases.json"
          test -x "$PROSE_HUMANIZER_HOME/.agents/skills/prose-humanizer/bin/prose-lint.js"
          test -f "$PROSE_HUMANIZER_HOME/.gemini/commands/prose-humanizer.toml"
          node "$PROSE_HUMANIZER_HOME/.agents/skills/prose-humanizer/bin/prose-lint.js" --help

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test PowerShell installer in an isolated home
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "prose-humanizer-home"
          ./install.ps1 -InstallRoot $installRoot
          $skillRoot = Join-Path $installRoot ".agents/skills/prose-humanizer"
          if (-not (Test-Path (Join-Path $skillRoot "SKILL.md"))) { throw "SKILL.md missing" }
          if (-not (Test-Path (Join-Path $skillRoot "references/eval.md"))) { throw "evaluation reference missing" }
          if (-not (Test-Path (Join-Path $skillRoot "rules/patterns.json"))) { throw "rules missing" }
          if (-not (Test-Path (Join-Path $skillRoot "evals/cases.json"))) { throw "behavior cases missing" }
          if (-not (Test-Path (Join-Path $installRoot ".gemini/commands/prose-humanizer.toml"))) { throw "Gemini command missing" }
