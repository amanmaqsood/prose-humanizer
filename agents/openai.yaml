interface:
  display_name: "Prose Humanizer"
  short_description: "Truthful, natural prose in the writer's voice"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#D4653D"
  default_prompt: "Use $prose-humanizer to draft, rewrite, voice-match, or audit this prose. Preserve supported facts, uncertainty, authorial choices, and the requested output contract."

policy:
  allow_implicit_invocation: true
